version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ai_calling_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://admin:adminpassword@db:5432/ai_calling_agent
      CORS_ORIGINS: http://localhost:3000
      CREDENTIAL_MASTER_KEY: change-me-to-a-32-byte-secret
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npx serve . -p 3000"
    volumes:
      - ./:/app:ro
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
